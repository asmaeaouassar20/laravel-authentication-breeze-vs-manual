<!DOCTYPE html >
<html lang='eng'>
	<head>
		<meta charset="utf-8" >
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="stylesheet" href="auth.css" />
		<title>Register</title>
	</head>
	
	<body>
		<div class="container vh-100 d-flex justify-content-center align-items-center">			
			   <div class="form rounded-3">
				 <h3 class="pt-3 ps-3 title-form">Register</h3>
				<form  class="ps-5 pt-3 pe-5 pb-4" >
					<div class="mb-3">
						<label class="form-label" for="email">Email</label>
						<input class="form-control" id="email" type="email" name="email" placeholder="Enter your email "  />
					</div>
					<div class="mb-3">
						<label class="form-label" for="phone">Phone</label>
						<input class="form-control" id="phone" type="text" name="phone" placeholder="Enter your phone"  />
					</div>
					<div class="mb-3">
						<label class="form-label" for="username">Username</label>
						<input class="form-control" id="username" type="text" name="username" placeholder="Enter your  Username"  />
					</div>
					<div class="mb-3">
						<label class="form-label" for="photo">Photo</label>
						<input class="form-control" id="photo" type="file" name="photo"   />
					</div>
					<div class="mb-3">
						<label class="form-label" for="password">Password</label>
						<input class="form-control" id="password" type="password" name="password" placeholder="Enter your password"  />
					</div>
					<div class="mb-3">
						<button class="btn btn-outline-dark me-2">Cancel</button>
						<button class="btn btn-dark" type="submit">Register</button>
					</div>
				</form>	
			</div>	   
		</div>
		
		
	</body>
</html>
