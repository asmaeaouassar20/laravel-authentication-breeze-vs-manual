<!DOCTYPE html >
<html lang='eng'>
	<head>
		<meta charset="utf-8" >
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="stylesheet" href="auth.css" />
		<title>Login</title>
	</head>
	
	<body>
		<div class="container vh-100 d-flex justify-content-center align-items-center">			
			   <div class="form rounded-3">
				 <h3 class="pt-3 ps-3 title-form">Login</h3>
				<form class="ps-5 pt-3 pe-5 pb-4" >
					<div class="mb-3">
						<label class="form-label" for="userLogin">Email / Phone / Username</label>
						<input class="form-control" id="userLogin" type="text" name="userLogin" placeholder="Enter your email / phone / Username"  />
					</div>
					<div class="mb-3">
						<label class="form-label" for="password">Password</label>
						<input class="form-control" id="password" type="password" name="password" placeholder="Enter your password"  />
					</div>
					<div class="mb-3">
						<button class="btn btn-outline-dark me-2">Cancel</button>
						<button class="btn btn-dark" type="submit">Login</button>
					</div>
				</form>	
			</div>	   
		</div>
			
	</body>
</html>
